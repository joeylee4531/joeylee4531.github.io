title: Roné's Security Blog
description: "아주대학교 사이버보안학과 로네의 보안 공부 기록"
logo_img: "/assets/img/favicon.webp"
profile_img: "/assets/img/profile-gudetama.png"

url: https://joeylee4531.github.io
lang: ko_KR
email: joeylee4531@gmail.com
github_username: joeylee4531
instagram_username: dlwotjd01

# If your repo name follows the format "<user-name>.github.io", then leave the below blank.
# Otherwise, set its value as "/<repo-name>". ex) baseurl: /myblog
baseurl:

# Build settings
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-loading-lazy

exclude:
  - docs/

collections:
  pages:
    output: true
    permalink: /:path.html

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      date: "1900-01-01"

# Markdown newline activator 
kramdown:
  input: GFM
  hard_wrap: true
